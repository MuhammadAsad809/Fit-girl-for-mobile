name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitman-v2.2-LiquidGlass.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitman-v2.0-LiquidGlass.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitman.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitman-v2.2-LiquidGlass-APK
          path: dist/Fitman-v2.2-LiquidGlass.apk
          retention-days: 14

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.2-${{ github.run_number }}
          name: "Fitman Native v2.2 (Apple Liquid Glass) Build ${{ github.run_number }}"
          body: |
            ## Fitman Native v2.2 — Apple Liquid Glass Complete UI Redesign

            Ultra-premium Apple iOS 45-inspired Liquid Glass & Obsidian Glassmorphism experience.

            ### Highlights:
            - **Unified Frosted Glass Segmented Capsule**: Floating pill navigation for Discover, Popular, New Releases, and Specials.
            - **Liquid Glass Shimmer Skeleton**: High-frame-rate animated skeletal placeholders during catalog loading.
            - **Cinematic Spotlight Hero Section**: Pulsing specular indicator dot, dynamic pricing pill, discount badges, and spring physics CTA.
            - **Optical Glass Refraction**: Multi-layer obsidian gradients, soft inner sheen layers, and hairline specular highlights.
            - **Tactile Touch Physics**: Fluid scale compression and spring returns across all interactive elements.
            - **Expanded Details & Repack Engine**: 1080p screenshot carousel, Metacritic badges, platform pills, and clean full-torrent launcher.
          files: |
            dist/Fitman-v2.2-LiquidGlass.apk
            dist/Fitman-v2.0-LiquidGlass.apk
            dist/Fitman.apk
            dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
