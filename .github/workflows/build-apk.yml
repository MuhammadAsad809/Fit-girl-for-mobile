name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitman-v2.3-GameHub.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitman-v2.2-LiquidGlass.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fitman.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fitman-v2.3-GameHub-APK
          path: dist/Fitman-v2.3-GameHub.apk
          retention-days: 14

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.3-${{ github.run_number }}
          name: "Fitman Native v2.3 (GameHub UI Edition) Build ${{ github.run_number }}"
          body: |
            ## Fitman Native v2.3 — GameHub & TapTap Full UI Overhaul

            Faithfully recreated and matched to user interface screenshots:
            
            ### Highlights:
            - **GameHub Top Bar**: Capsule search pill ("FIFA 22") with notification bell and scanner icon buttons.
            - **Category Underline Tabs**: Minimal white indicator pill underneath active subtabs (Recommended, PC Games, Retro Games).
            - **Featured "Today" Hero Banner**: Dynamic date pill, cinematic video/artwork preview, quote subtitle with audio mute toggle, and dash carousel indicators.
            - **Your Next Favorite**: Continuous squircle game cards in horizontal carousel.
            - **News & Updates**: Banner carousels for GSFG 1.1 frame interpolation and updates.
            - **5-Tab Dock**: Home, Community, Ranking, Library, Profile with high-contrast active icons.
            - **Dedicated Ranking Screen**: Popular (Ranks 1 to 10 with Gold, Silver, Bronze badges) and Hot Games (with Star Ratings ★ 9.6 and Genres) side-by-side swipeable cards.
          files: |
            dist/Fitman-v2.3-GameHub.apk
            dist/Fitman-v2.2-LiquidGlass.apk
            dist/Fitman.apk
            dist/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
